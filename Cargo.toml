[workspace]
resolver = "3"
members = [
    "crates/api",
    "crates/worker",
    "crates/domain",
    "crates/storage",
    "crates/db",
    "crates/media",
    "crates/importer",
    "crates/migrate",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
# HTML sanitizer for the archived-email reader, built on html5ever so hostile
# markup is parsed the way a browser parses it rather than by regex. Pinned
# exactly: a silent relaxation of its allowlist is a rendering-security change,
# so upgrades go through the hostile fixtures in crates/media/tests.
ammonia = "=4.1.4"
anyhow = "1.0.104"
async-trait = "0.1.89"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
fs2 = "0.4.3"
futures-util = "0.3.32"
# Pure-Rust MIME/RFC 5322 parser. `full_encoding` pulls in encoding_rs for the
# legacy charsets present in a ten-year archive; no other features are enabled.
mail-parser = { version = "0.11.5", default-features = false, features = ["full_encoding"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = [
    "chrono",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "uuid",
] }
tokio = { version = "1.53.1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
tokio-util = { version = "0.7.18", features = ["io"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
